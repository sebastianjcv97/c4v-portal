  <style>
    /* Página pública del CeVi comercial: el toro y la burbuja, nada más.
       Colores y letras del portal (styles.css). */
    html,body.ventas{height:100%}
    body.ventas{margin:0;color:#fff;background:radial-gradient(120% 90% at 50% 30%,#ff2a20 0%,var(--rojo) 38%,var(--rojo-tinta) 100%);
      min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden}
    .v-arriba{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px 0;max-width:720px;width:100%;margin:0 auto;box-sizing:border-box}
    .v-arriba img{height:22px;width:auto;filter:brightness(0) invert(1)}
    .v-arriba a{font-size:var(--t-sm);color:#fff;opacity:.9;font-weight:500;text-decoration:none}
    .v-arriba a:hover,.v-arriba a:focus-visible{opacity:1;text-decoration:underline}
    /* La escena: el toro arriba y la burbuja del widget abajo. El widget ocupa
       toda la escena (su panel de chat sube y tapa al toro al abrirse). */
    .v-escena{position:relative;flex:1;min-height:520px;max-width:720px;width:100%;margin:0 auto}
    .v-hola{position:absolute;inset:0 0 110px;display:grid;place-content:center;justify-items:center;gap:10px;text-align:center;padding:0 20px;z-index:0}
    .v-hola img{width:clamp(150px,30vh,240px);height:auto;filter:drop-shadow(0 14px 28px rgba(80,0,0,.35));animation:v-flota 3.6s ease-in-out infinite}
    .v-hola h1{font-family:var(--slab);font-weight:800;font-size:clamp(30px,5.5vh,42px);line-height:1.1;margin:6px 0 0;color:#fff}
    .v-hola p{margin:0;font-size:var(--t-md);color:#fff;opacity:.92}
    @keyframes v-flota{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @media (prefers-reduced-motion:reduce){.v-hola img{animation:none}}
    .v-escena elevenlabs-convai{position:absolute;inset:0;display:block;z-index:1;--el-overlay-padding:0px}
    .v-cargando{position:absolute;left:0;right:0;bottom:28px;margin:0;display:grid;justify-items:center;gap:10px;text-align:center;
      font-weight:500;color:#fff;opacity:.9;z-index:2;padding:0 20px}
    .v-cargando .btn{background:#fff;color:var(--rojo-tinta);border:0}

    .v-pie{padding:16px 18px 16px;text-align:center;font-size:var(--t-xs);line-height:var(--lh-snug);color:#fff}
    .v-pie a{color:#fff}
    .v-pie .v-wa{display:inline-block;font-size:var(--t-sm);font-weight:500;margin-bottom:6px}
    .v-pie p{margin:0;opacity:.8}

  <script src="../js/config.js?v=20260924b"></script>
  <script>
  /* CeVi comercial en la página pública. Sin login: cevi-backend da URLs
     firmadas a quien viene de este origen (con topes por visitante).
     Mismas reglas que el CeVi de soporte (ver app.js, ceviElevenLabsIniciar):
     - cada URL firmada sirve UNA sola vez y el widget gasta la del atributo
       signed-url al leer su configuración: esa es solo para la configuración
       y cada llamada toma otra de la reserva (se mantienen 2, vencen a los 15
       min y se descartan a los 12);
     - no se cambia signed-url ni se mueve el elemento después de montarlo. */
  (function () {
    const CFG = window.C4V_CONFIG || {};
    const API = CFG.ceviApi || 'https://cevi-backend-general.up.railway.app';
    const host = document.getElementById('ceviWidgetHost');
    const VIDA = 12 * 60e3;
    const estado = { pool: [], pidiendo: false, reintento: null };

    // WhatsApp de ventas con un mensaje ya escrito.
    const wa = CFG.whatsapp && CFG.whatsapp.numero;
    if (wa) document.getElementById('ventasWa').href = 'https://wa.me/' + wa + '?text=' +
      encodeURIComponent('Hola, vengo de la página de CeVi y quiero información de las máquinas láser C4V.');

    // Seudónimo estable del visitante (sin FingerprintJS): agrupa sus
    // conversaciones en ElevenLabs sin saber quién es.
    let visitante = null;
    try {
      visitante = localStorage.getItem('c4v_visitante');
      if (!visitante) { visitante = 'vis_' + crypto.randomUUID().replace(/-/g, '').slice(0, 16); localStorage.setItem('c4v_visitante', visitante); }
    } catch { visitante = 'vis_' + Math.random().toString(36).slice(2, 14); }

    async function pedirUrl() {
      try {
        const r = await fetch(API + '/voz/url-publica', { method: 'POST',
          signal: AbortSignal.timeout ? AbortSignal.timeout(12000) : undefined });
        if (!r.ok) return null;
        return (await r.json()).signed_url || null;
      } catch { return null; }
    }
    function tomar() {
      estado.pool = estado.pool.filter(x => Date.now() - x.en < VIDA);
      return estado.pool.pop()?.url || null;
    }
    async function rellenar(espera = 1000) {
      if (estado.pidiendo || !document.getElementById('ceviVentas')) return;
      estado.pool = estado.pool.filter(x => Date.now() - x.en < VIDA);
      if (estado.pool.length >= 2) return;
      estado.pidiendo = true;
      let u = null;
      try { u = await pedirUrl(); } finally { estado.pidiendo = false; }
      clearTimeout(estado.reintento);
      if (u) { estado.pool.push({ url: u, en: Date.now() }); rellenar(); return; }
      const prox = Math.min(espera * 2, 60e3);
      estado.reintento = setTimeout(() => rellenar(prox), prox);
    }
    const revisar = () => { if (document.visibilityState === 'visible') rellenar(); };
    document.addEventListener('visibilitychange', revisar);
    ['online', 'focus', 'pageshow'].forEach(ev => window.addEventListener(ev, revisar));

    function noDisponible() {
      host.querySelector('.v-cargando')?.remove();
      const p = document.createElement('div');
      p.className = 'v-cargando';
      p.innerHTML = '<span>CeVi no está disponible en este momento.</span>' +
        '<button type="button" class="btn primary">Reintentar</button>';
      p.querySelector('button').onclick = () => { p.textContent = 'Preparando a CeVi…'; iniciar(); };
      host.appendChild(p);
    }

    async function iniciar() {
      if (!document.getElementById('script-11labs-convai')) {
        const s = document.createElement('script');
        s.id = 'script-11labs-convai';
        s.src = 'https://unpkg.com/@elevenlabs/convai-widget-embed@0.18.2';   // versión fija
        s.async = true;
        document.head.appendChild(s);
      }
      const urls = (await Promise.all([pedirUrl(), pedirUrl()])).filter(Boolean);
      if (!urls.length) { noDisponible(); return; }
      if (urls[1]) estado.pool.push({ url: urls[1], en: Date.now() });
      const el = document.createElement('elevenlabs-convai');
      el.id = 'ceviVentas';
      el.setAttribute('signed-url', urls[0]);          // solo para leer la configuración
      if (visitante) el.setAttribute('user-id', visitante);
      el.addEventListener('elevenlabs-convai:call', (e) => {
        const cfg = e.detail && e.detail.config;
        if (!cfg || !el.isConnected) return;
        const url = tomar();                             // una URL, una llamada
        if (url) { cfg.signedUrl = url; cfg.connectionType = 'websocket'; delete cfg.agentId; }
        rellenar();
      });
      host.querySelector('.v-cargando')?.remove();
      host.appendChild(el);
      rellenar();
      setInterval(() => rellenar(), 60e3);
    }
    iniciar();
  })();
  </script>
