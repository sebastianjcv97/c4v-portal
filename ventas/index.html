  <style>
    /* Página pública del CeVi comercial: el toro y la burbuja, nada más.
       Colores y letras del portal (styles.css). */
    html,body.ventas{height:100%}
    body.ventas{margin:0;color:#fff;background:radial-gradient(120% 90% at 50% 30%,#ff2a20 0%,var(--rojo) 38%,var(--rojo-tinta) 100%);
      min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden}
    .v-arriba{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px 0;max-width:720px;width:100%;margin:0 auto;box-sizing:border-box}
    .v-arriba img{height:22px;width:auto;filter:brightness(0) invert(1)}
    .v-arriba a{font-size:var(--t-sm);color:#fff;opacity:.9;font-weight:500;text-decoration:none}
    .v-arriba a:hover,.v-arriba a:focus-visible{opacity:1;text-decoration:underline}
    /* La escena: el toro arriba y la burbuja del widget abajo. El widget ocupa
       toda la escena (su panel de chat sube y tapa al toro al abrirse). */
    .v-escena{position:relative;flex:1;min-height:520px;max-width:720px;width:100%;margin:0 auto}
    .v-hola{position:absolute;inset:0 0 104px;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;padding:0 20px;z-index:0}
    /* El botón para hablar: el toro en un disco blanco, con micrófono y
       anillos que laten. En llamada reacciona al volumen (--v de 0 a 1). */
    .v-hablar{--v:0;position:relative;width:clamp(200px,34vh,270px);aspect-ratio:1;border-radius:50%;border:0;padding:0;cursor:pointer;
      background:#fff;box-shadow:0 18px 44px rgba(80,0,0,.45);transform:scale(calc(1 + var(--v) * .12));transition:transform .08s linear}
    .v-hablar:focus-visible{outline:4px solid #fff;outline-offset:6px}
    .v-hablar img{position:absolute;inset:6% 8% 10%;width:84%;height:84%;object-fit:contain;pointer-events:none}
    .v-hablar::before,.v-hablar::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:3px solid rgba(255,255,255,.75);
      animation:v-anillo 2.4s ease-out infinite;pointer-events:none}
    .v-hablar::after{animation-delay:1.2s}
    @keyframes v-anillo{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.28);opacity:0}}
    .v-mic{position:absolute;right:2%;bottom:4%;width:30%;aspect-ratio:1;border-radius:50%;background:var(--rojo-tinta);color:#fff;
      display:grid;place-items:center;box-shadow:0 6px 16px rgba(80,0,0,.4);border:4px solid #fff}
    .v-mic svg{width:52%;height:52%}
    .v-hola h1{font-family:var(--slab);font-weight:800;font-size:clamp(28px,5vh,40px);line-height:1.1;margin:4px 0 0;color:#fff}
    .v-hola p{margin:0;font-size:var(--t-md);color:#fff;opacity:.92;max-width:30ch}
    /* Estados de la llamada */
    .v-hola[data-estado="conectando"] .v-hablar::before,.v-hola[data-estado="conectando"] .v-hablar::after{animation-duration:1s}
    .v-hola[data-estado="escuchando"] .v-hablar::before,.v-hola[data-estado="escuchando"] .v-hablar::after,
    .v-hola[data-estado="hablando"] .v-hablar::before,.v-hola[data-estado="hablando"] .v-hablar::after{animation:none;opacity:calc(.35 + var(--v));transform:scale(calc(1 + var(--v) * .35))}
    .v-hola[data-estado="escuchando"] .v-mic,.v-hola[data-estado="hablando"] .v-mic,.v-hola[data-estado="conectando"] .v-mic{background:#fff;color:var(--rojo-tinta);border-color:var(--rojo-tinta)}
    @media (prefers-reduced-motion:reduce){.v-hablar::before,.v-hablar::after{animation:none;opacity:.5}.v-hablar{transition:none}}
    /* El widget queda encima (su panel de chat tapa al botón al abrirse) pero
       deja pasar los toques donde no dibuja nada: sus partes visibles ya
       traen pointer-events:auto. */
    .v-escena elevenlabs-convai{position:absolute;inset:0;display:block;z-index:1;--el-overlay-padding:0px;pointer-events:none}
    .v-cargando{position:absolute;left:0;right:0;bottom:28px;margin:0;display:grid;justify-items:center;gap:10px;text-align:center;
      font-weight:500;color:#fff;opacity:.9;z-index:2;padding:0 20px}
    .v-cargando .btn{background:#fff;color:var(--rojo-tinta);border:0}
    .v-cargando a{color:#fff}
    .v-pie{padding:16px 18px 16px;text-align:center;font-size:var(--t-xs);line-height:var(--lh-snug);color:#fff}
    .v-pie a{color:#fff}
    .v-pie .v-wa{display:inline-block;font-size:var(--t-sm);font-weight:500;margin-bottom:6px}
    .v-pie p{margin:0;opacity:.8}
  </style>

<body class="ventas">
  <nav class="v-arriba" aria-label="C4V Láser">
    <img src="../assets/c4v-wordmark.png" alt="C4V Láser" />
    <a href="../">Soy cliente</a>
  </nav>

  <main class="v-escena" id="ceviWidgetHost" aria-label="Conversación con CeVi">
    <div class="v-hola" id="ventasHola" data-estado="reposo">
      <button type="button" class="v-hablar" id="ventasHablar" aria-describedby="ventasEstado" disabled>
        <img src="../assets/cevi/saluda.png" alt="" width="240" height="240" />
        <span class="v-mic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
      </button>
      <h1 id="ventasTitulo">Toca para hablar</h1>
      <p id="ventasEstado" aria-live="polite">CeVi, el asesor de C4V con inteligencia artificial, te ayuda a elegir tu máquina láser.</p>
    </div>
    <p class="v-cargando">Preparando a CeVi…</p>
  </main>

  <footer class="v-pie">
    <a class="v-wa" id="ventasWa" href="https://wa.me/51924662205" target="_blank" rel="noopener">o escríbenos por WhatsApp</a>
    <p>CeVi responde con inteligencia artificial. <a href="../privacidad.html">Privacidad</a> · <a href="../terminos.html">Términos</a> · <a href="../libro-reclamaciones.html">Libro de Reclamaciones</a></p>
  </footer>

  <script src="../js/config.js?v=20260924c"></script>
  <script>
  /* CeVi comercial en la página pública. Sin login: cevi-backend da URLs
     firmadas a quien viene de este origen (con topes por visitante).
     Mismas reglas que el CeVi de soporte (ver app.js, ceviElevenLabsIniciar):
     - cada URL firmada sirve UNA sola vez y el widget gasta la del atributo
       signed-url al leer su configuración: esa es solo para la configuración
       y cada llamada toma otra de la reserva (se mantienen 2, vencen a los 15
       min y se descartan a los 12);
     - no se cambia signed-url ni se mueve el elemento después de montarlo. */
  (function () {
    const CFG = window.C4V_CONFIG || {};
    const API = CFG.ceviApi || 'https://cevi-backend-general.up.railway.app';
    const host = document.getElementById('ceviWidgetHost');
    const VIDA = 12 * 60e3;
    const estado = { pool: [], pidiendo: false, reintento: null };

    // WhatsApp de ventas con un mensaje ya escrito.
    const wa = CFG.whatsapp && CFG.whatsapp.numero;
    if (wa) document.getElementById('ventasWa').href = 'https://wa.me/' + wa + '?text=' +
      encodeURIComponent('Hola, vengo de la página de CeVi y quiero información de las máquinas láser C4V.');

    // Seudónimo estable del visitante (sin FingerprintJS): agrupa sus
    // conversaciones en ElevenLabs sin saber quién es.
    let visitante = null;
    try {
      visitante = localStorage.getItem('c4v_visitante');
      if (!visitante) { visitante = 'vis_' + crypto.randomUUID().replace(/-/g, '').slice(0, 16); localStorage.setItem('c4v_visitante', visitante); }
    } catch { visitante = 'vis_' + Math.random().toString(36).slice(2, 14); }

    async function pedirUrl() {
      try {
        const r = await fetch(API + '/voz/url-publica', { method: 'POST',
          signal: AbortSignal.timeout ? AbortSignal.timeout(12000) : undefined });
        if (!r.ok) return null;
        return (await r.json()).signed_url || null;
      } catch { return null; }
    }
    function tomar() {
      estado.pool = estado.pool.filter(x => Date.now() - x.en < VIDA);
      return estado.pool.pop()?.url || null;
    }
    async function rellenar(espera = 1000) {
      if (estado.pidiendo || !document.getElementById('ceviVentas')) return;
      estado.pool = estado.pool.filter(x => Date.now() - x.en < VIDA);
      if (estado.pool.length >= 2) return;
      estado.pidiendo = true;
      let u = null;
      try { u = await pedirUrl(); } finally { estado.pidiendo = false; }
      clearTimeout(estado.reintento);
      if (u) { estado.pool.push({ url: u, en: Date.now() }); rellenar(); return; }
      const prox = Math.min(espera * 2, 60e3);
      estado.reintento = setTimeout(() => rellenar(prox), prox);
    }
    const revisar = () => { if (document.visibilityState === 'visible') rellenar(); };
    document.addEventListener('visibilitychange', revisar);
    ['online', 'focus', 'pageshow'].forEach(ev => window.addEventListener(ev, revisar));

    function noDisponible() {
      host.querySelector('.v-cargando')?.remove();
      const p = document.createElement('div');
      p.className = 'v-cargando';
      p.innerHTML = '<span>CeVi no está disponible en este momento.</span>' +
        '<button type="button" class="btn primary">Reintentar</button>';
      p.querySelector('button').onclick = () => { p.textContent = 'Preparando a CeVi…'; iniciar(); };
      host.appendChild(p);
    }

    /* ---------- El botón grande: toca para hablar ---------- */
    const hola = document.getElementById('ventasHola');
    const boton = document.getElementById('ventasHablar');
    const titulo = document.getElementById('ventasTitulo');
    const estadoTxt = document.getElementById('ventasEstado');
    const TEXTO_REPOSO = estadoTxt.textContent;
    const voz = { conv: null, pedida: false, raf: 0, espera: null };
    const ESTADOS = {
      reposo: ['Toca para hablar', TEXTO_REPOSO],
      conectando: ['Conectando…', 'Si el navegador pregunta, permite el micrófono.'],
      escuchando: ['Te escucho…', 'Háblale como a un asesor. Toca a CeVi para terminar.'],
      hablando: ['CeVi está hablando', 'Toca a CeVi para terminar.'],
      sinmic: ['Toca para hablar', 'No se pudo conectar. Revisa que el navegador tenga permiso de micrófono, o escríbele con el globito de abajo.'],
    };
    function estadoVoz(e) {
      hola.dataset.estado = e;
      [titulo.textContent, estadoTxt.textContent] = ESTADOS[e];
      boton.setAttribute('aria-label', e === 'reposo' || e === 'sinmic' ? 'Hablar con CeVi' : 'Terminar la conversación con CeVi');
      clearTimeout(voz.espera);
      // Si pidió hablar y no conecta (micrófono negado, aviso sin aceptar), no queda colgado.
      if (e === 'conectando') voz.espera = setTimeout(() => { if (!voz.conv) estadoVoz('sinmic'); }, 20000);
    }
    function seguirVoz() {
      cancelAnimationFrame(voz.raf);
      const paso = () => {
        const c = voz.conv;
        if (!c || !c.isOpen || !c.isOpen()) { voz.conv = null; voz.pedida = false; boton.style.setProperty('--v', 0); estadoVoz('reposo'); return; }
        const sale = c.getOutputVolume ? c.getOutputVolume() : 0;
        const entra = c.getInputVolume ? c.getInputVolume() : 0;
        const e = sale > 0.02 ? 'hablando' : 'escuchando';
        if (hola.dataset.estado !== e) estadoVoz(e);
        boton.style.setProperty('--v', Math.min(1, (e === 'hablando' ? sale : entra) * 2.5).toFixed(3));
        voz.raf = requestAnimationFrame(paso);
      };
      voz.raf = requestAnimationFrame(paso);
    }
    function prepararBoton(el) {
      // El botón nativo "Iniciar conversación" aparece cuando el widget termina de cargar.
      const buscar = () => el.shadowRoot?.querySelector('button[aria-label="' + INICIAR + '"]');
      const listo = setInterval(() => { if (buscar()) { clearInterval(listo); boton.disabled = false; } }, 250);
      boton.onclick = () => {
        if (voz.conv) { try { voz.conv.endSession(); } catch {} return; }       // en llamada: terminar
        const b = buscar();
        if (!b) return;
        estadoVoz('conectando');
        b.click();                                                              // la misma llamada del widget nativo
      };
    }
    const INICIAR = 'Iniciar conversación';   // text_contents.start_call del agente (etiqueta del botón nativo)

    async function iniciar() {
      if (!document.getElementById('script-11labs-convai')) {
        const s = document.createElement('script');
        s.id = 'script-11labs-convai';
        s.src = 'https://unpkg.com/@elevenlabs/convai-widget-embed@0.18.2';   // versión fija
        s.async = true;
        document.head.appendChild(s);
      }
      const urls = (await Promise.all([pedirUrl(), pedirUrl()])).filter(Boolean);
      if (!urls.length) { noDisponible(); return; }
      if (urls[1]) estado.pool.push({ url: urls[1], en: Date.now() });
      const el = document.createElement('elevenlabs-convai');
      el.id = 'ceviVentas';
      el.setAttribute('signed-url', urls[0]);          // solo para leer la configuración
      if (visitante) el.setAttribute('user-id', visitante);
      el.addEventListener('elevenlabs-convai:call', (e) => {
        const cfg = e.detail && e.detail.config;
        if (!cfg || !el.isConnected) return;
        const url = tomar();                             // una URL, una llamada
        if (url) { cfg.signedUrl = url; cfg.connectionType = 'websocket'; delete cfg.agentId; }
        // Llamada de voz: el botón grande muestra el estado con el volumen real.
        // (onConversationCreated el widget no lo usa: lo deja pasar.)
        if (!cfg.textOnly) {
          voz.pedida = true; estadoVoz('conectando');
          const antes = cfg.onConversationCreated;
          cfg.onConversationCreated = (c) => { try { antes?.(c); } catch {} voz.conv = c; seguirVoz(); };
        }
        rellenar();
      });
      host.querySelector('.v-cargando')?.remove();
      host.appendChild(el);
      prepararBoton(el);
      rellenar();
      setInterval(() => rellenar(), 60e3);
    }
    iniciar();
  })();
  </script>
</body>
